name: KPM compile check

# Verification for the kernel side of the KPM runtime.
#
# The release pipeline ships its inter-job artifacts through GitHub Release
# assets, which makes it a poor verification target: a failing asset upload
# cancels the whole matrix. This workflow instead builds kernelsu.ko *and*
# kpm.ko for every KMI in the MRSU support matrix, and runs the host unit
# suites in kernel/kpm/tests, so a change can be validated independently of the
# artifact plumbing.
#
# The repository is public, so these runs do not consume Actions minutes.

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - 'uapi/**'
      - '.github/workflows/kpm-compile.yml'

concurrency:
  group: kpm-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: kernelsu.ko + kpm.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Build the modules
      working-directory: kernel
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        echo "=== Building kernelsu.ko + kpm.ko for KMI: ${{ matrix.kmi }} ==="
        make clean >/dev/null 2>&1 || true
        CONFIG_KSU=m CC=clang make KSU_PACKAGE_NAME=com.mingri.ru \
          KSU_EXPECTED_SIZE=0x036d \
          KSU_EXPECTED_HASH=5ccb0ad242b96baea99ebdf96d6ee01875781a3784693d4299319155c9843f2d
        ls -l kernelsu.ko
        # kpm.ko is built by the same make invocation; a red build here means
        # the standalone runtime no longer compiles for this KMI.
        ls -l kpm.ko

  hosttests:
    name: host unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    # Compiles the real kernel sources against stub headers and runs every
    # suite; no kernel tree or device needed.
    - name: Run the KPM host suites
      run: bash kernel/kpm/tests/run.sh
